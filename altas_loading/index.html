<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Loading Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ====== COULEURS (modifie ici) ====== */
  :root {
    --accent: #4dff7a;      /* liens, accents */
    --bar: #39ff5a;         /* barre de chargement */
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.65);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #020a03;
    color: var(--text);
    font-family: "Montserrat", Arial, sans-serif;
  }

  /* Tous les calques animés sont posés sur leur propre couche GPU.
     On n'anime QUE transform et opacity → pas de recalcul de la page. */
  .layer {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform, opacity;
  }

  /* ====== FOND ====== */
  #media { background: #020a03; overflow: hidden; }
  .slide {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    -webkit-transition: opacity 1.2s ease;
    transition: opacity 1.2s ease;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform, opacity;
  }
  .slide.visible { opacity: 1; }
  .slide video {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Entrée : léger dézoom (sans flou) puis respiration très lente */
  body.full .slide {
    -webkit-animation: heroIn 1.6s cubic-bezier(.2,.9,.25,1) both, breathe 14s ease-in-out 1.6s infinite alternate;
    animation: heroIn 1.6s cubic-bezier(.2,.9,.25,1) both, breathe 14s ease-in-out 1.6s infinite alternate;
  }
  @-webkit-keyframes heroIn { from { -webkit-transform: scale(1.15); } to { -webkit-transform: scale(1.02); } }
  @keyframes heroIn { from { transform: scale(1.15); } to { transform: scale(1.02); } }
  @-webkit-keyframes breathe { from { -webkit-transform: scale(1.02); } to { -webkit-transform: scale(1.06); } }
  @keyframes breathe { from { transform: scale(1.02); } to { transform: scale(1.06); } }

  .shade {
    background:
      -webkit-linear-gradient(top, rgba(2,10,3,0.35) 0%, rgba(2,10,3,0) 25%, rgba(2,10,3,0) 62%, rgba(2,10,3,0.8) 100%);
    background:
      linear-gradient(180deg, rgba(2,10,3,0.35) 0%, rgba(2,10,3,0) 25%, rgba(2,10,3,0) 62%, rgba(2,10,3,0.8) 100%);
  }

  /* ====== HALO QUI "BAT" DERRIÈRE LE LOGO (opacité seulement) ====== */
  #glow {
    top: 52%; left: 50%;
    width: 64vw; height: 46vh;
    margin: -23vh 0 0 -32vw;
    background: -webkit-radial-gradient(center, ellipse closest-side, rgba(90,255,120,0.55) 0%, rgba(57,255,90,0.18) 50%, rgba(57,255,90,0) 100%);
    background: radial-gradient(closest-side, rgba(90,255,120,0.55) 0%, rgba(57,255,90,0.18) 50%, rgba(57,255,90,0) 100%);
    opacity: 0.2;
    -webkit-animation: beat 3.2s ease-in-out infinite;
    animation: beat 3.2s ease-in-out infinite;
  }
  @-webkit-keyframes beat { 0%, 70%, 100% { opacity: 0.15; } 12% { opacity: 0.85; } 30% { opacity: 0.35; } 45% { opacity: 0.7; } }
  @keyframes beat { 0%, 70%, 100% { opacity: 0.15; } 12% { opacity: 0.85; } 30% { opacity: 0.35; } 45% { opacity: 0.7; } }

  /* ====== REFLET QUI TRAVERSE L'ÉCRAN ====== */
  #sweep { overflow: hidden; }
  #sweep i {
    position: absolute; top: -50%; left: 0;
    width: 30%; height: 200%;
    background: -webkit-linear-gradient(left, rgba(160,255,180,0) 0%, rgba(160,255,180,0.13) 50%, rgba(160,255,180,0) 100%);
    background: linear-gradient(90deg, rgba(160,255,180,0) 0%, rgba(160,255,180,0.13) 50%, rgba(160,255,180,0) 100%);
    -webkit-transform: translateX(-150%) rotate(20deg);
    transform: translateX(-150%) rotate(20deg);
    -webkit-animation: sweep 7s ease-in-out 2s infinite;
    animation: sweep 7s ease-in-out 2s infinite;
    will-change: transform;
  }
  @-webkit-keyframes sweep { 0% { -webkit-transform: translateX(-150%) rotate(20deg); } 35%, 100% { -webkit-transform: translateX(450%) rotate(20deg); } }
  @keyframes sweep { 0% { transform: translateX(-150%) rotate(20deg); } 35%, 100% { transform: translateX(450%) rotate(20deg); } }

  /* ====== LIGNE DE SCAN ====== */
  #scan i {
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: -webkit-linear-gradient(left, transparent, rgba(77,255,122,0.9), transparent);
    background: linear-gradient(90deg, transparent, rgba(77,255,122,0.9), transparent);
    opacity: 0.5;
    -webkit-animation: scan 6s linear infinite;
    animation: scan 6s linear infinite;
    will-change: transform;
  }
  @-webkit-keyframes scan { 0% { -webkit-transform: translateY(-10px); } 60%, 100% { -webkit-transform: translateY(105vh); } }
  @keyframes scan { 0% { transform: translateY(-10px); } 60%, 100% { transform: translateY(105vh); } }

  /* ====== FLASH D'ENTRÉE ====== */
  #flash {
    background: #b6ffc6;
    opacity: 0;
    -webkit-animation: flash 1.2s ease-out 0.1s both;
    animation: flash 1.2s ease-out 0.1s both;
  }
  @-webkit-keyframes flash { 0% { opacity: 0; } 8% { opacity: 0.8; } 100% { opacity: 0; } }
  @keyframes flash { 0% { opacity: 0; } 8% { opacity: 0.8; } 100% { opacity: 0; } }

  /* ====== LETTRES GÉANTES (optionnel, CONFIG.bigText) ====== */
  #bigtext {
    display: none;
    top: 50%; left: 50%; width: auto; height: auto;
    white-space: nowrap;
    font-weight: 800; font-style: italic;
    font-size: 30vw;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 2px rgba(77, 255, 122, 0.4);
    -webkit-transform: translate(-54%, -52%);
    transform: translate(-54%, -52%);
    -webkit-animation: drift 30s ease-in-out infinite alternate;
    animation: drift 30s ease-in-out infinite alternate;
  }
  @-webkit-keyframes drift { from { -webkit-transform: translate(-54%, -52%); } to { -webkit-transform: translate(-46%, -52%); } }
  @keyframes drift { from { transform: translate(-54%, -52%); } to { transform: translate(-46%, -52%); } }

  /* ====== CHARGEMENT ====== */
  .loader {
    position: fixed; left: 50%; bottom: 9vh;
    width: 28vw; min-width: 300px;
    margin-left: -14vw;
    z-index: 5;
    -webkit-animation: fadeIn 0.8s ease 0.8s both;
    animation: fadeIn 0.8s ease 0.8s both;
  }
  @media (max-width: 1071px) { .loader { margin-left: -150px; } }
  @-webkit-keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #status {
    font-size: 11px; font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    height: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bar { position: relative; height: 3px; background: rgba(255,255,255,0.18); overflow: hidden; }
  /* La barre grandit avec scaleX (pas width) → fluide */
  .bar-fill {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bar);
    -webkit-transform-origin: left center;
    transform-origin: left center;
    -webkit-transform: scaleX(0);
    transform: scaleX(0);
    -webkit-transition: -webkit-transform 0.4s ease-out;
    transition: transform 0.4s ease-out;
    will-change: transform;
  }
  .loader-row { overflow: hidden; margin-top: 10px; height: 22px; }
  #percent { float: left; font-size: 18px; font-weight: 800; }
  #files { float: right; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 1px; line-height: 22px; }
  #file {
    margin-top: 4px; height: 13px;
    font-size: 10px; color: rgba(255,255,255,0.35);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #links { position: fixed; right: 3vw; top: 3vh; z-index: 5; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  #links a { color: var(--accent); text-decoration: none; }
  #links:empty { display: none; }
</style>
</head>
<body>

<div id="media" class="layer"></div>
<div id="glow" class="layer"></div>
<div class="shade layer"></div>
<div id="bigtext" class="layer"></div>
<div id="sweep" class="layer"><i></i></div>
<div id="scan" class="layer"><i></i></div>
<canvas id="particles" class="layer"></canvas>

<div class="loader">
  <div id="status">Connexion au serveur...</div>
  <div class="bar"><div class="bar-fill" id="bar"></div></div>
  <div class="loader-row">
    <div id="percent">0%</div>
    <div id="files"></div>
  </div>
  <div id="file"></div>
</div>

<div id="links"></div>
<div id="flash" class="layer"></div>
<audio id="music" loop></audio>

<script>
  /* =====================================================
     CONFIGURATION — modifie uniquement cette partie
     ===================================================== */
  var CONFIG = {
    // ---- TES IMAGES ET VIDÉOS DE FOND ----
    // type: "image" ou "video" | duration: durée d'affichage en ms
    media: [
      { type: "image", src: "media/altas%20loading.png", duration: 10000 }
      // { type: "image", src: "media/screen1.jpg", duration: 9000 },
      // { type: "video", src: "media/video1.webm" }
    ],

    bigText: "",                // ex: "ALTAS" → lettres géantes en contour derrière le logo

    particles: true,
    particleColor: [77, 255, 122],
    bokehCount: 30,             // grosses bulles floues
    streakCount: 40,            // petits traits qui tombent
    fps: 30,                    // images/s des particules (30 = fluide et léger)

    unitLabel: "fichiers",
    music: "",                  // ex: "media/musique.mp3"
    musicVolume: 0.3,
    videoSound: false,
    links: ""                   // ex: '<a href="#">discord.gg/altasrp</a>'
  };

  /* ===================================================== */

  function $(id) { return document.getElementById(id); }
  function setText(id, txt) {
    var el = $(id);
    if (el.firstChild) el.firstChild.nodeValue = txt;
    else el.appendChild(document.createTextNode(txt));
  }

  // L'ancien navigateur de GMod (Awesomium, branche par défaut) est très lent :
  // on coupe automatiquement les effets lourds.
  var LITE = /Awesomium/i.test(navigator.userAgent);
  document.body.className = LITE ? "lite" : "full";

  if (CONFIG.links) $("links").innerHTML = CONFIG.links;
  if (CONFIG.bigText && !LITE) { setText("bigtext", CONFIG.bigText); $("bigtext").style.display = "block"; }
  if (LITE) {
    $("sweep").style.display = "none";
    $("scan").style.display = "none";
  }

  // ---------- Fond : images / vidéos ----------
  var mediaIndex = 0, currentSlide = null, failures = 0;

  function showNextMedia() {
    var list = CONFIG.media;
    if (!list.length || failures >= list.length) return;
    var item = list[mediaIndex];
    mediaIndex = (mediaIndex + 1) % list.length;
    var done = false;
    function next() { if (!done) { done = true; showNextMedia(); } }
    function fail() { failures++; next(); }

    var slide = document.createElement("div");
    slide.className = "slide";

    if (item.type === "video") {
      var v = document.createElement("video");
      v.src = item.src;
      v.autoplay = true;
      v.muted = !CONFIG.videoSound;
      if (list.length === 1) v.loop = true;
      else if (!item.duration) v.onended = next;
      v.onerror = fail;
      slide.appendChild(v);
      show(slide, item, next);
    } else {
      // Précharge l'image entière avant de l'afficher
      var img = new Image();
      img.onload = function () {
        failures = 0;
        slide.style.backgroundImage = "url('" + item.src + "')";
        show(slide, item, next);
      };
      img.onerror = fail;
      img.src = item.src;
    }
  }

  function show(slide, item, next) {
    $("media").appendChild(slide);
    setTimeout(function () { slide.className = "slide visible"; }, 30);
    var old = currentSlide;
    currentSlide = slide;
    if (old) {
      old.className = "slide";
      setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1300);
    }
    if (CONFIG.media.length > 1 && (item.type === "image" || item.duration)) {
      setTimeout(next, item.duration || 9000);
    }
  }
  showNextMedia();

  // ---------- Particules (limitées en FPS, rendu léger) ----------
  (function particles() {
    var canvas = $("particles");
    if (!CONFIG.particles || !canvas.getContext) { canvas.style.display = "none"; return; }
    var ctx = canvas.getContext("2d");
    var W, H;
    // En mode lite : moins de particules et canvas à mi-résolution
    var scale = LITE ? 0.5 : 1;
    var nBokeh = LITE ? Math.round(CONFIG.bokehCount / 3) : CONFIG.bokehCount;
    var nStreak = LITE ? Math.round(CONFIG.streakCount / 3) : CONFIG.streakCount;
    var frameMs = 1000 / (LITE ? 20 : CONFIG.fps);

    function resize() {
      W = Math.round(window.innerWidth * scale);
      H = Math.round(window.innerHeight * scale);
      canvas.width = W; canvas.height = H;
    }
    resize();
    window.onresize = resize;

    function rand(a, b) { return a + Math.random() * (b - a); }
    function newBokeh(top) {
      var depth = Math.random();
      return {
        x: rand(-50, W), y: top ? rand(-60, -10) : rand(0, H),
        r: (3 + depth * depth * 30) * scale,
        vx: rand(0.2, 0.7) * (0.4 + depth) * scale,
        vy: rand(0.6, 1.6) * (0.4 + depth) * scale,
        a: rand(0.25, 0.65) * (1 - depth * 0.45)
      };
    }
    function newStreak(top) {
      return { x: rand(0, W), y: top ? -20 : rand(0, H), len: rand(6, 16) * scale, v: rand(3, 6) * scale, a: rand(0.3, 0.8) };
    }
    var bokeh = [], streaks = [], i;
    for (i = 0; i < nBokeh; i++) bokeh.push(newBokeh());
    for (i = 0; i < nStreak; i++) streaks.push(newStreak());

    // Bulle pré-rendue une seule fois
    var sprite = document.createElement("canvas");
    sprite.width = 64; sprite.height = 96;
    var sc = sprite.getContext("2d");
    var pc = CONFIG.particleColor.join(",");
    sc.translate(32, 48); sc.scale(1, 1.5);
    var g = sc.createRadialGradient(0, 0, 0, 0, 0, 32);
    g.addColorStop(0, "rgba(" + pc + ",0.95)");
    g.addColorStop(0.45, "rgba(" + pc + ",0.5)");
    g.addColorStop(1, "rgba(" + pc + ",0)");
    sc.fillStyle = g;
    sc.beginPath(); sc.arc(0, 0, 32, 0, Math.PI * 2); sc.fill();

    var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(function () { f(+new Date()); }, frameMs); };
    var last = 0;

    function draw(now) {
      raf(draw);
      now = now || +new Date();
      if (now - last < frameMs) return;
      var k = last ? Math.min((now - last) / 33, 3) : 1;  // vitesse constante quel que soit le FPS
      last = now;

      ctx.clearRect(0, 0, W, H);

      for (var i = 0; i < bokeh.length; i++) {
        var b = bokeh[i];
        b.x += b.vx * k; b.y += b.vy * k;
        if (b.y - b.r * 2 > H || b.x - b.r > W) { bokeh[i] = newBokeh(true); continue; }
        ctx.globalAlpha = b.a;
        ctx.drawImage(sprite, b.x - b.r, b.y - b.r * 1.5, b.r * 2, b.r * 3);
      }

      // Tous les traits en un seul tracé
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = "rgb(" + pc + ")";
      ctx.lineWidth = 2 * scale;
      ctx.beginPath();
      for (var j = 0; j < streaks.length; j++) {
        var s = streaks[j];
        s.y += s.v * k; s.x += s.v * 0.35 * k;
        if (s.y > H + 20) { streaks[j] = newStreak(true); continue; }
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x + s.len * 0.35, s.y + s.len);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    raf(draw);
  })();

  // ---------- Musique ----------
  function startMusic(volume) {
    if (!CONFIG.music || $("music").getAttribute("src")) return;
    var m = $("music");
    m.src = CONFIG.music;
    m.volume = Math.max(0, Math.min(1, CONFIG.musicVolume * volume));
    var p = m.play();
    if (p && p.catch) p.catch(function () {});
  }

  // ---------- Progression ----------
  // GMod appelle DownloadingFile très souvent : on ne met à jour l'affichage
  // que 10 fois par seconde au maximum.
  var filesTotal = 0, filesNeeded = 0, lastFile = "", forced100 = false, dirty = true;
  var shownPct = -1;

  setInterval(function () {
    if (!dirty) return;
    dirty = false;
    var pct = 0;
    if (forced100) pct = 100;
    else if (filesTotal > 0) pct = Math.round(((filesTotal - filesNeeded) / filesTotal) * 100);
    pct = Math.max(0, Math.min(100, pct));
    if (pct !== shownPct) {
      shownPct = pct;
      var t = "scaleX(" + (pct / 100) + ")";
      $("bar").style.webkitTransform = t;
      $("bar").style.transform = t;
      setText("percent", pct + "%");
    }
    if (filesTotal > 0) setText("files", (filesTotal - filesNeeded) + " / " + filesTotal + " " + CONFIG.unitLabel);
    setText("file", lastFile);
  }, 100);

  /* =====================================================
     FONCTIONS APPELÉES PAR GARRY'S MOD
     ===================================================== */
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    startMusic(typeof volume === "number" ? volume : 1);
  }
  function SetFilesTotal(total) { filesTotal = total; dirty = true; }
  function SetFilesNeeded(needed) { filesNeeded = needed; dirty = true; }
  function DownloadingFile(fileName) {
    filesNeeded = Math.max(0, filesNeeded - 1);
    lastFile = fileName;
    if (!downloading) { downloading = true; setText("status", "Téléchargement..."); }
    dirty = true;
  }
  var downloading = false;

  var STATUS_FR = {
    "Retrieving server info": "Récupération des infos...",
    "Sending client info...": "Envoi des infos client...",
    "Client info sent!": "Infos client envoyées !",
    "Received all Lua files we needed!": "Fichiers Lua reçus !",
    "Mounting Addons": "Montage des addons...",
    "Workshop Complete": "Workshop terminé",
    "Starting Lua...": "Démarrage de Lua...",
    "Lua Started!": "Entrée en ville..."
  };
  function SetStatusChanged(status) {
    downloading = false;
    setText("status", STATUS_FR[status] || status);
    if (status === "Sending client info..." || status === "Lua Started!") forced100 = true;
    dirty = true;
  }

  // Aperçu dans un navigateur normal (hors jeu) : simule un chargement
  var inGame = false;
  var _gd = GameDetails;
  GameDetails = function () { inGame = true; _gd.apply(this, arguments); };
  setTimeout(function () {
    if (inGame || filesTotal > 0) return;
    SetFilesTotal(68); SetFilesNeeded(68);
    var n = 0;
    var sim = setInterval(function () {
      n++;
      DownloadingFile("addons/workshop_" + (2800000000 + n * 1337) + ".gma");
      if (n >= 68) { clearInterval(sim); SetStatusChanged("Sending client info..."); }
    }, 150);
  }, 2000);
</script>
</body>
</html>
